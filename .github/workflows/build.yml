name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'boards/**'
      - 'config/**'
      - 'dts/**'
      - 'snippets/**'
      - 'src/**'
      - 'zephyr/**'
      - 'build.yaml'
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'CMakeLists.txt'
      - 'Kconfig'
      - 'boards/**'
      - 'config/**'
      - 'dts/**'
      - 'snippets/**'
      - 'src/**'
      - 'zephyr/**'
      - 'build.yaml'

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
